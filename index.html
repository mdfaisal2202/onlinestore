<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Collection - Luxury Essentials</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Top Nav -->
    <nav class="top-nav">
        <div class="container nav-bar">
            <div class="logo">UNIQUE<span>COLLECTION</span></div>
            <div class="search-container">
                <select id="catSelect">
                    <option value="all">All</option>
                    <option value="clothes">Clothes</option>
                    <option value="shoes">Shoes</option>
                    <option value="watches">Watches</option>
                    <option value="sunglasses">Sunglasses</option>
                    <option value="accessories">Accessories</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search premium luxury items...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-right">
                <button id="wishlistIcon" class="nav-icon"><i class="fas fa-heart"></i> <span id="wishCount">0</span></button>
                <button id="cartIconBtn" class="nav-icon">
                    <i class="fas fa-shopping-cart"></i> 
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <div class="account">
                    <i class="fas fa-user"></i>
                    <span>Account</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Header -->
    <header class="main-header">
        <div class="container">
            <div class="dept-links">
                <a href="#" class="dept-link active" data-cat="all">All</a>
                <a href="#" class="dept-link" data-cat="clothes">Fashion</a>
                <a href="#" class="dept-link" data-cat="shoes">Footwear</a>
                <a href="#" class="dept-link" data-cat="watches">Watches</a>
                <a href="#" class="dept-link" data-cat="sunglasses">Eyewear</a>
                <a href="#" class="dept-link" data-cat="accessories">Accessories</a>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container hero-content">
            <h1>Timeless Luxury Awaits</h1>
            <p>Handpicked premium pieces for the modern connoisseur</p>
            <button onclick="document.getElementById('productGrid').scrollIntoView({behavior:'smooth'})" class="hero-btn">Shop Now</button>
        </div>
    </section>

    <div class="container main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <label>Sort By</label>
                <select id="sortSelect">
                    <option value="default">Featured</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="priceHigh">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                </select>
            </div>
        </aside>

        <!-- Products -->
        <div class="product-section">
            <h2>Premium Luxury Picks</h2>
            <div class="product-grid" id="productGrid"></div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Cart</h2>
                <button id="closeCartModal">✕</button>
            </div>
            <div id="cartItemsList"></div>
            <div id="cartTotalAmount" class="cart-total"></div>
            <button id="checkoutBtnFinal" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Wishlist Modal -->
    <div class="modal" id="wishlistModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Wishlist</h2>
                <button id="closeWishModal">✕</button>
            </div>
            <div id="wishlistItemsList"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastMsg" class="toast"></div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Unique Collection • Luxury Redefined</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
